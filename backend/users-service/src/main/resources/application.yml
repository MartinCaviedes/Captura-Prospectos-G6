server:
  port: ${PORT:8081}
spring:
  application:
    name: users-service
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
security:
  jwt:
    issuer: ${JWT_ISSUER:captura-g6-users}
    audience: ${JWT_AUDIENCE:captura-g6-api}
    public-key: ${JWT_PUBLIC_KEY}
    private-key: ${JWT_PRIVATE_KEY}
