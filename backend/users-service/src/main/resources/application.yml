server:
  shutdown: graceful
  port: ${PORT:8081}
spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  application:
    name: users-service
  datasource:
    url: ${IDENTITY_JDBC_URL:jdbc:h2:mem:identity_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${IDENTITY_DB_USER:sa}
    password: ${IDENTITY_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
security:
  jwt:
    issuer: ${JWT_ISSUER:captura-g6-users}
    audience: ${JWT_AUDIENCE:captura-g6-api}
    public-key: ${JWT_PUBLIC_KEY}
    private-key: ${JWT_PRIVATE_KEY}
