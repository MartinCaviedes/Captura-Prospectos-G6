server:
  forward-headers-strategy: none
  shutdown: graceful
  port: ${PORT:8080}
spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
security:
  login-rate-limit:
    requests: ${LOGIN_RATE_LIMIT_REQUESTS:60}
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
    max-clients: ${LOGIN_RATE_LIMIT_MAX_CLIENTS:10000}
  jwt:
    issuer: ${JWT_ISSUER:captura-g6-users}
    audience: ${JWT_AUDIENCE:captura-g6-api}
    public-key: ${JWT_PUBLIC_KEY}
services:
  users:
    url: ${USERS_SERVICE_URL:http://127.0.0.1:8081}
  prospects:
    url: ${PROSPECTS_SERVICE_URL:http://127.0.0.1:8082}
